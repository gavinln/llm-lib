[project]
name = "redis-examples"
version = "0.1.0"
requires-python = "==3.11.17"
dependencies = [
    "fire>=0.7.1",
    "flask>=3.1.3",
    "ipython>=9.18.1",
    "openai>=3.53.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pytest>=9.2.0",
    "redis>=8.1.0",
    "redisvl>=0.32.0",
    "sentence-transformers>=6.3.0",
]

[tool.uv]
package = false

[tool.poetry]
name = "redis-examples"
version = "0.1.0"
description = ""
authors = ["Gavin Noronha <gavinln@hotmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "3.11.17"
ipython = "^8.24.0"
pandas = "^2.2.2"
pytest = "^8.2.0"
fire = "^0.6.0"
redis = "^5.0.4"
flask = "^3.0.3"
sentence-transformers = "^2.7.0"
pyarrow = "^16.0.0"
openai = "^1.28.1"
redisvl = "^0.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
